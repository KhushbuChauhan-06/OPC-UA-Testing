[pytest]
testpaths = tests
asyncio_mode = auto
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
markers =
    smoke: Fast checks that verify the test environment is operational.
    functional: End-to-end OPC UA client-server communication tests.
    subscription: OPC UA subscription and monitored-item tests.
    security: OPC UA authentication, certificate, and transport-security tests.
    negative: Invalid-input and expected-failure behavior tests.
